name: canaries

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: classifier canary (7/7)
        working-directory: monitors
        run: python classifier_canary.py
      - name: uncx exit canary (6/6)
        working-directory: monitors
        run: python uncx_exit_canary.py
